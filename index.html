<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PREACH · entrar na sala</title>
<style>
:root{--bg:#07090d;--fg:#eef4f8;--muted:#8b96a5;--accent:#8ff0c2;--line:#1b2531}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(circle at 50% -20%,#18212d 0%,#0a0d12 40%,#07090d 100%);color:var(--fg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.card{width:100%;max-width:430px;background:#0b0f15;border:1px solid var(--line);border-radius:18px;padding:26px 22px;
  box-shadow:0 24px 70px rgba(0,0,0,.55)}
.kicker{font-size:11px;letter-spacing:3px;color:var(--accent);font-weight:900}
h1{font-size:24px;margin:8px 0 6px;line-height:1.2}
p{font-size:14px;color:var(--muted);line-height:1.55;margin:0 0 14px}
label{display:block;font-size:11px;letter-spacing:1.6px;color:var(--muted);font-weight:800;margin-bottom:8px}
input{width:100%;padding:16px 14px;font-size:22px;letter-spacing:4px;text-transform:uppercase;text-align:center;
  background:#05070a;border:1px solid var(--line);border-radius:12px;color:var(--fg);outline:none;font-weight:800}
input:focus{border-color:var(--accent)}
button{width:100%;margin-top:14px;padding:16px;border:none;border-radius:12px;background:var(--accent);color:#06120c;
  font-size:15px;font-weight:900;letter-spacing:2px;cursor:pointer}
button:active{transform:translateY(1px)}
.hint{font-size:12.5px;margin-top:16px;color:var(--muted)}
a{color:var(--accent)}
.err{color:#ff8f9b;font-size:13px;min-height:18px;margin-top:8px}
</style>
</head>
<body>
<div class="card">
  <div class="kicker">PREACH</div>
  <h1>Controle pelo celular</h1>
  <p>O <b>PC</b> abre o <code>PREACH_FLOW_V10_ESPELHO.html</code> e toca o áudio. Aqui você entra na sala e manda TOCAR, intensidade, fala e fade — o palco responde na hora.</p>
  <label for="code">Código da sala</label>
  <input id="code" inputmode="latin" maxlength="16" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ex.: K9347XHWV9X7">
  <div class="err" id="err"></div>
  <button id="go">ENTRAR NA SALA</button>
  <p class="hint">Pegue o código no PC: clique em <b>ESPELHAR</b>.<br>
  Controle direto: <a href="espelho/PREACH_ESPELHO.html">espelho/PREACH_ESPELHO.html</a></p>
</div>
<script>
(function(){
  var i=document.getElementById('code'),err=document.getElementById('err');
  function norm(v){return String(v||'').toUpperCase().replace(/[^A-Z2-9]/g,'').slice(0,16)}
  i.addEventListener('input',function(){i.value=norm(i.value)});
  function go(){
    var c=norm(i.value);
    if(c.length<8){err.textContent='o código tem no mínimo 8 caracteres';i.focus();return}
    err.textContent='';
    location.href='espelho/PREACH_ESPELHO.html#'+c;
  }
  document.getElementById('go').addEventListener('click',go);
  i.addEventListener('keydown',function(e){if(e.key==='Enter')go()});
})();
</script>
</body>
</html>
